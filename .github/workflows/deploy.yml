name: Deploy to DigitalOcean

on:
  push:
    tags:
      - 'v*'  # Trigger on tags that start with "v"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check MaxMind secrets are available
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          # Lengths only - never echo the values themselves. An unset GitHub
          # secret expands to an empty string rather than failing, so without
          # this check a misnamed or unscoped secret gives a green deploy that
          # silently skipped the GeoIP2 stage.
          echo "MAXMIND_ACCOUNT_ID length:  ${#MAXMIND_ACCOUNT_ID}"
          echo "MAXMIND_LICENSE_KEY length: ${#MAXMIND_LICENSE_KEY}"
          missing=0
          if [ -z "$MAXMIND_ACCOUNT_ID" ]; then
            echo "::error::MAXMIND_ACCOUNT_ID is empty or not set"
            missing=1
          fi
          if [ -z "$MAXMIND_LICENSE_KEY" ]; then
            echo "::error::MAXMIND_LICENSE_KEY is empty or not set"
            missing=1
          fi
          exit "$missing"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add DigitalOcean host to known_hosts
        run: |
          mkdir -p ~/.ssh
          HOST='${{ secrets.SERVER_HOST }}'
          echo "Host length: ${#HOST}"
          echo "Resolving host..."
          getent hosts "$HOST" || echo "  (DNS lookup failed)"
          echo "Checking port 22..."
          nc -zv -w 5 "$HOST" 22 || echo "  (port 22 unreachable)"
          echo "Running ssh-keyscan..."
          ssh-keyscan -v -T 10 -H "$HOST" > ~/.ssh/known_hosts 2> /tmp/keyscan.err
          echo "--- keyscan stderr ---"
          cat /tmp/keyscan.err
          echo "--- keyscan stdout (known_hosts) ---"
          cat ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: known_hosts is empty — see diagnostics above"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Debug SSH connection (optional)
        run: |
          ssh -o "StrictHostKeyChecking=yes" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'echo SSH connection successful!'

      - name: Deploy to DigitalOcean
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          # Prepend the MaxMind credentials to the piped script rather than
          # passing them in the ssh command, so they never reach the remote
          # argv (visible in ps) or the remote filesystem.
          account_id=$(printf '%s' "$MAXMIND_ACCOUNT_ID" | tr -d '[:space:]')
          license_key=$(printf '%s' "$MAXMIND_LICENSE_KEY" | tr -d '[:space:]')
          {
            printf 'export MAXMIND_ACCOUNT_ID=%q\n' "$MAXMIND_ACCOUNT_ID"
            printf 'export MAXMIND_LICENSE_KEY=%q\n' "$MAXMIND_LICENSE_KEY"
            cat ./scripts/deploy.sh
          } | ssh -o "StrictHostKeyChecking=yes" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s'
