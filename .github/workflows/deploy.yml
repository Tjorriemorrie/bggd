name: Deploy to DigitalOcean

on:
  push:
    tags:
      - 'v*'  # Trigger on tags that start with "v"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add DigitalOcean host to known_hosts
        run: |
          mkdir -p ~/.ssh
          HOST='${{ secrets.SERVER_HOST }}'
          echo "Host length: ${#HOST}"
          echo "Resolving host..."
          getent hosts "$HOST" || echo "  (DNS lookup failed)"
          echo "Checking port 22..."
          nc -zv -w 5 "$HOST" 22 || echo "  (port 22 unreachable)"
          echo "Running ssh-keyscan..."
          ssh-keyscan -v -T 10 -H "$HOST" > ~/.ssh/known_hosts 2> /tmp/keyscan.err
          echo "--- keyscan stderr ---"
          cat /tmp/keyscan.err
          echo "--- keyscan stdout (known_hosts) ---"
          cat ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: known_hosts is empty — see diagnostics above"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Debug SSH connection (optional)
        run: |
          ssh -o "StrictHostKeyChecking=yes" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'echo SSH connection successful!'

      - name: Deploy to DigitalOcean
        run: |
          ssh -o "StrictHostKeyChecking=yes" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' < ./scripts/deploy.sh
