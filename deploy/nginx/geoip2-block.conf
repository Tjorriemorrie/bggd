# Managed by deploy/geoip-setup.sh - edit here, not on the server.
# Installed to /etc/nginx/snippets/geoip2-block.conf and included from every
# server block in /etc/nginx/sites-available/bggd.
#
# 444 closes the connection without a response, so blocked scrapers get nothing
# back to react to.

if ($geo_blocked) {
    return 444;
}
