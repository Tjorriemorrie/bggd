# Managed by deploy/geoip-setup.sh - edit here, not on the server.
# Installed to /etc/nginx/conf.d/geoip2.conf (http context).
#
# To change which countries are blocked, edit the map below and push a v* tag.

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 12h;
    $geoip2_country_iso country iso_code;
}

map $geoip2_country_iso $geo_blocked {
    default 0;
    CN 1;  # China
    SG 1;  # Singapore
}
