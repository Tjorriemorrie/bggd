{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="{{ og_title }}">
    <meta property="og:description" content="{{ og_desc }}">
    <meta property="og:image" content="{{ og_img }}">
    <meta property="og:url" content="{{ og_url }}">
    <meta property="og:type" content="website">

    <title>{% block title %}BGG Data{% endblock %}</title>

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'main/favicon.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'main/favicon.png' %}">

    <link href="{% static 'main/bootstrap-5.3.3-dist/css/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="{% static 'main/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css' %}"
          rel="stylesheet"/>

    <link href="{% static 'main/css/main.css' %}" rel="stylesheet"/>

    <script src="{% static 'main/bootstrap-5.3.3-dist/js/bootstrap.min.js' %}"
            type="text/javascript"></script>
    <script src="{% static 'main/js/main.js' %}" type="text/javascript"></script>
</head>
<body>
<div class="container-fluid">
    {% include 'main/snippet_navbar.html' %}

    <!-- Flash messages -->
    {% if messages %}
        <div class="alert-container">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}

    <footer>
        <p>
            Bitcoin donations:<br/>
            38W8wv3h3oFUP9TBa4fgvab3zP6WFUAKs6<br/>
            <img class="img-fluid" src="{% static 'main/img/btc.png' %}"/>
        </p>
    </footer>
</div>
</body>
</html>
