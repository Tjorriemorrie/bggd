{% load humanize %}
{% load fmt %}

{% if games %}
    <div class="container-fluid mt-4">
        <div class="row">
            {% for game in games %}
                <div class="col-md-4 col-lg-2 mb-4 d-flex align-items-stretch">
                    <div class="card h-100">
                        <a href="{{ game.get_absolute_url }}" class="">
                            <img src="{{ game.img }}" class="card-img-top {% if not game.shop_in_stock %}card-img-oos{% endif %}">
                        </a>
                        <div class="card-body">
                            <h5 class="card-title">
                                <a href="{{ game.get_absolute_url }}"
                                   class="{% if not game.shop_in_stock %}card-title-oos{% endif %}">
                                    {{ game.name }}
                                </a>
                            </h5>
                            <p class="card-text">{{ game|price }}</p>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <span>{{ game.shop_best.name }}</span>
                            {% if game.shop_saving %}
                                <span>{{ game|discount }}</span>
                            {% endif %}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
