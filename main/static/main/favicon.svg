<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- background: rounded dark walnut square -->
  <rect width="32" height="32" rx="7" fill="#2a1f1a"/>
  <!-- gold border inset -->
  <rect x="2" y="2" width="28" height="28" rx="5.5" fill="none" stroke="#c8a45c" stroke-width="1.2"/>
  <!-- die face: 5-pip arrangement -->
  <!-- top-left -->
  <circle cx="10" cy="10" r="2.4" fill="#c8a45c"/>
  <!-- top-right -->
  <circle cx="22" cy="10" r="2.4" fill="#c8a45c"/>
  <!-- center -->
  <circle cx="16" cy="16" r="2.4" fill="#faf8f5"/>
  <!-- bottom-left -->
  <circle cx="10" cy="22" r="2.4" fill="#c8a45c"/>
  <!-- bottom-right -->
  <circle cx="22" cy="22" r="2.4" fill="#c8a45c"/>
</svg>
